apiVersion: v1
kind: Pod
metadata: {name: demo}
spec:
  containers:
    - name: app
      image: example.invalid/demo:1
      ports: [{name: web, containerPort: 8080}]
      resources:
        requests: {cpu: 100m, memory: 64Mi}
        limits: {cpu: '1', memory: 512Mi}
      readinessProbe:
        httpGet: {path: /ready, port: web}
